<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#071323"/>
  <rect x="60" y="49" width="6" height="48" fill="#0052D9"/>
  <text x="86" y="89" font-family="Arial, Microsoft YaHei" font-size="48" font-weight="700" fill="#F6F9FF">一条命令，启动经过实际生成检查的服务</text>
  <text x="60" y="145" font-family="Arial, Microsoft YaHei" font-size="36" fill="#B4C5DA">默认单卡 BF16，三个点开启，MTP 关闭。</text>
  <rect x="60" y="187" width="1160" height="76" fill="#10243C"/>
  <rect x="60" y="187" width="6" height="76" fill="#0052D9"/>
  <text x="90" y="236" font-family="Consolas, Microsoft YaHei" font-size="36" fill="#7ED8D0">bash scripts/start_server.sh</text>
  <g id="delivery-pipeline" data-chart-type="pipeline_with_stages">
    <rect x="60" y="322" width="250" height="190" fill="#10243C"/>
    <text x="84" y="369" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">代码</text>
    <text x="84" y="412" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">保留完整 Git 历史</text>
    <line x1="84" y1="437" x2="286" y2="437" stroke="#294361"/>
    <text x="84" y="477" font-family="Consolas, Microsoft YaHei" font-size="18" fill="#64B5FF">README-CSIG.md</text>
    <path d="M321 414H346 M339 407L346 414L339 421" fill="none" stroke="#64B5FF" stroke-width="3"/>
    <rect x="360" y="322" width="250" height="190" fill="#10243C"/>
    <text x="384" y="369" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">服务</text>
    <text x="384" y="412" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">真实生成 8 个 token</text>
    <line x1="384" y1="437" x2="586" y2="437" stroke="#294361"/>
    <text x="384" y="477" font-family="Consolas, Microsoft YaHei" font-size="24" fill="#64B5FF">manifest.json</text>
    <path d="M621 414H646 M639 407L646 414L639 421" fill="none" stroke="#64B5FF" stroke-width="3"/>
    <rect x="660" y="322" width="250" height="190" fill="#10243C"/>
    <text x="684" y="369" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">评测</text>
    <text x="684" y="412" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">性能与正确性分开</text>
    <line x1="684" y1="437" x2="886" y2="437" stroke="#294361"/>
    <text x="684" y="477" font-family="Consolas, Microsoft YaHei" font-size="24" fill="#64B5FF">results/</text>
    <path d="M921 414H946 M939 407L946 414L939 421" fill="none" stroke="#64B5FF" stroke-width="3"/>
    <rect x="960" y="322" width="260" height="190" fill="#0052D9"/>
    <text x="984" y="369" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">证据</text>
    <text x="984" y="412" font-family="Arial, Microsoft YaHei" font-size="24" fill="#F6F9FF">命令、哈希与日志</text>
    <line x1="984" y1="437" x2="1196" y2="437" stroke="#64B5FF"/>
    <text x="984" y="477" font-family="Arial, Microsoft YaHei" font-size="24" fill="#F6F9FF">SQLite / trace</text>
