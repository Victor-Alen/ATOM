  <text x="60" y="578" font-family="Consolas, Microsoft YaHei" font-size="24" fill="#64B5FF">--moe-opt 0/1</text>
  <text x="400" y="578" font-family="Consolas, Microsoft YaHei" font-size="24" fill="#64B5FF">--attention-opt 0/1</text>
  <text x="805" y="578" font-family="Consolas, Microsoft YaHei" font-size="24" fill="#64B5FF">--compile-graph-opt 0/1</text>
  <text x="60" y="622" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">在题目冻结容器内运行；依赖与源码随仓库交付，不更换环境或下载权重。</text>
  <line x1="60" y1="649" x2="1220" y2="649" stroke="#294361"/>
  <text x="60" y="677" font-family="Arial, Microsoft YaHei" font-size="18" fill="#8EA5C1">启动：scripts/start_server.sh；复现与开关：README-CSIG.md；最终 Git 提交见交付索引。</text>
  <text x="1220" y="677" text-anchor="end" font-family="Consolas, Microsoft YaHei" font-size="18" fill="#8EA5C1">11 / 16</text>
