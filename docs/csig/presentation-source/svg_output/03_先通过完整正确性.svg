<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#071323"/>
  <g id="title">
    <rect x="60" y="49" width="6" height="48" fill="#0052D9"/>
    <text x="86" y="89" font-family="Arial, Microsoft YaHei" font-size="48" font-weight="700" fill="#F6F9FF">先修复数值边界，再恢复并行</text>
    <text x="60" y="145" font-family="Arial, Microsoft YaHei" font-size="36" fill="#B4C5DA">固定输入接近，不等于自回归输出一致。</text>
  </g>
  <g id="accuracy-evidence">
    <text x="60" y="221" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">C200 · 每条前 64 token · 全部一致</text>
    <text x="55" y="326" font-family="Consolas, Microsoft YaHei" font-size="96" font-weight="700" fill="#7ED8D0">12800/12800</text>
    <text x="60" y="384" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">严格 16K 输入：64 个生成 token 完全一致</text>
    <text x="60" y="425" font-family="Arial, Microsoft YaHei" font-size="24" fill="#64B5FF">另 3 条 16K 输入：串行 / 并发复测 384/384</text>
    <path d="M790 201V397" fill="none" stroke="#294361" stroke-width="2"/>
    <text x="830" y="227" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">HumanEval pass@1</text>
    <text x="830" y="298" font-family="Consolas, Microsoft YaHei" font-size="48" font-weight="700" fill="#F6F9FF">148/164</text>
    <text x="830" y="348" font-family="Arial, Microsoft YaHei" font-size="32" fill="#7ED8D0">与 HF 相差 0 个百分点</text>
    <text x="830" y="389" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">164 条完整输出也逐题一致</text>
  </g>
  <g id="validation-flow">
    <rect x="60" y="464" width="330" height="76" fill="#10243C"/>
    <rect x="475" y="464" width="330" height="76" fill="#10243C"/>
    <rect x="890" y="464" width="330" height="76" fill="#0052D9"/>
    <text x="225" y="513" text-anchor="middle" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">逐算子检查</text>
    <text x="640" y="513" text-anchor="middle" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">整模型自由生成</text>
    <text x="1055" y="513" text-anchor="middle" font-family="Arial, Microsoft YaHei" font-size="32" fill="#F6F9FF">完整门槛验收</text>
    <path d="M405 502H447 M820 502H862" fill="none" stroke="#64B5FF" stroke-width="3"/>
    <path d="M445 493L458 502L445 511Z M860 493L873 502L860 511Z" fill="#64B5FF"/>
    <text x="225" y="585" text-anchor="middle" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">BF16 舍入 / shape / K 顺序</text>
    <text x="640" y="585" text-anchor="middle" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">不喂入参考答案的前缀</text>
    <text x="1055" y="585" text-anchor="middle" font-family="Arial, Microsoft YaHei" font-size="24" fill="#B4C5DA">C200 / 16K / HumanEval</text>
  </g>
  <g id="footer">
    <path d="M60 649H1220" fill="none" stroke="#294361" stroke-width="1"/>
    <text x="60" y="678" font-family="Arial, Microsoft YaHei" font-size="18" fill="#8EA5C1">证据：final-current/model/correctness 与补充16K；单卡 BF16、MTP 关闭；公开集不等于隐藏集。</text>
    <text x="1220" y="678" text-anchor="end" font-family="Arial, Microsoft YaHei" font-size="18" fill="#8EA5C1">03 / 16</text>
  </g>
</svg>
